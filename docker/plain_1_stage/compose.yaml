services:
  app:
    image: localhost:5000/tvprog3:${TAG:-latest}
    build:
      context: .
      args:
        TMDB_API_TOKEN: ${TMDB_API_TOKEN:?TMDB_API_TOKEN not set}
        OMDB_API_KEY: ${OMDB_API_KEY:?OMDB_API_KEY not set}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-tvprog3}
      DB_USER: ${DB_USER:-tvprog3}
    ports:
      - "1701:1701"
      - "4999:4999"
      - "8080:8080"
    restart: unless-stopped
